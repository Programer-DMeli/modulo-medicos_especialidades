# Ejecución normal: MariaDB de XAMPP. El perfil demo requiere activación explícita.
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medico_especialidad}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
server.port=${PORT:8080}
spring.web.error.include-message=always
