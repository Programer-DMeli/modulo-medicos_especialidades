<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar horario | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="horarios-registrar">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row"><aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Agenda médica</span><h1>Registrar horario</h1><p>Configura un nuevo turno de atención.</p></div><a class="btn btn-outline-secondary" th:href="@{/horarios}">Volver</a></div>
    <div id="mensaje"></div><form id="form-horario" class="card content-card"><div class="card-body form-grid">
        <div class="grid-full"><label class="form-label" for="medicoId">Médico</label><select class="form-select" id="medicoId" name="medicoId" required><option value="">Cargando médicos...</option></select></div>
        <div><label class="form-label" for="diaSemana">Día de la semana</label><select class="form-select" id="diaSemana" name="diaSemana" required><option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option></select></div>
        <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div>
        <div><label class="form-label" for="horaInicio">Hora de inicio</label><input class="form-control" type="time" id="horaInicio" name="horaInicio" required></div>
        <div><label class="form-label" for="horaFin">Hora de fin</label><input class="form-control" type="time" id="horaFin" name="horaFin" required></div>
        <div><label class="form-label" for="duracionCita">Duración por cita</label><div class="input-group"><input class="form-control" type="number" id="duracionCita" name="duracionCita" min="1" value="30" required><span class="input-group-text">minutos</span></div></div>
        <div><label class="form-label" for="consultorioId">Consultorio (opcional)</label><select class="form-select" id="consultorioId" name="consultorioId"><option value="">Sin asignar</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/horarios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar horario</button></div></form>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
