<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head(${esMedico} ? 'Mis ausencias' : 'Ausencias')}"></head>
<body data-page="horarios-ausencias" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1 th:text="${esMedico} ? 'Mis ausencias' : 'Ausencias médicas'">Ausencias médicas</h1><p th:text="${esMedico} ? 'Consulta tus vacaciones y permisos registrados.' : 'Registra vacaciones y permisos por fecha. El horario habitual se conserva.'">Ausencias por fecha.</p></div></div><nav class="page-tabs" aria-label="Vistas de horarios"><a th:href="@{/horarios}"><i class="bi bi-calendar-week" aria-hidden="true"></i>Horario habitual</a><a th:href="@{/horarios/agenda}"><i class="bi bi-calendar3" aria-hidden="true"></i>Agenda semanal</a><a th:href="@{/horarios/ausencias}" class="active" aria-current="page"><i class="bi bi-calendar-x" aria-hidden="true"></i>Ausencias</a></nav><div id="mensaje" aria-live="polite"></div>
<form id="form-ausencia" class="card content-card mb-4" sec:authorize="hasAnyRole('ADMINISTRADOR','RECEPCIONISTA')"><div class="card-header"><h2 class="mb-0">Registrar ausencia</h2></div><div class="card-body form-grid">
    <div class="grid-full"><label class="form-label" for="medicoId">Médico</label><select class="form-select" id="medicoId" name="medicoId" required><option value="">Cargando médicos…</option></select></div>
    <div><label class="form-label" for="inicio">Desde</label><input class="form-control" type="datetime-local" id="inicio" name="inicio" required></div>
    <div><label class="form-label" for="fin">Hasta</label><input class="form-control" type="datetime-local" id="fin" name="fin" required></div>
    <div class="grid-full"><label class="form-label" for="motivo">Motivo</label><textarea class="form-control" id="motivo" name="motivo" rows="2" maxlength="200" placeholder="Por ejemplo: vacaciones o permiso personal" required></textarea><div class="form-text">La agenda descontará este intervalo de las franjas de atención.</div></div>
    <input type="hidden" name="estado" value="ACTIVO">
</div><div class="card-footer form-actions"><button class="btn btn-primary" type="submit"><i class="bi bi-calendar-x" aria-hidden="true"></i>Guardar ausencia</button></div></form>
<section class="card content-card" aria-labelledby="ausencias-registradas"><div class="card-header"><h2 class="mb-0" id="ausencias-registradas">Ausencias registradas</h2></div><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th scope="col">Médico</th><th scope="col">Periodo</th><th scope="col">Motivo</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr></thead><tbody id="tabla-ausencias"><tr><td colspan="5" class="loading-cell">Cargando ausencias…</td></tr></tbody></table></div></div></section>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
