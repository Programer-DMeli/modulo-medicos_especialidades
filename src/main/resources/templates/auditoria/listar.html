<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Auditoría')}"></head>
<body data-page="auditoria-listar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Auditoría</h1><p>Consulta quién realizó cada creación, actualización o eliminación y cuándo ocurrió.</p></div></div>
    <div id="mensaje" aria-live="polite"></div>
    <div class="card content-card"><div class="card-body">
        <div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead><tr><th scope="col">ID</th><th scope="col">Fecha y hora</th><th scope="col">Usuario</th><th scope="col">Operación</th><th scope="col">Entidad</th><th scope="col">Registro</th></tr></thead>
            <tbody id="tabla-auditoria"><tr><td colspan="6" class="loading-cell">Cargando registros...</td></tr></tbody>
        </table></div>
    </div></div>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
