<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Asignar consultorio')}"></head>
<body data-page="consultorios-asignar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Asignar consultorio</h1><p>Asigna un ambiente al horario habitual. Se verifican los cruces de día, hora y vigencia.</p></div><a class="btn btn-outline-secondary" th:href="@{/consultorios}">Volver</a></div>
    <div id="mensaje" aria-live="polite"></div><form id="form-asignacion" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="horarioId">Horario médico</label><select class="form-select" id="horarioId" name="horarioId" required><option value="">Cargando horarios...</option></select></div>
        <div><label class="form-label" for="consultorioId">Consultorio</label><select class="form-select" id="consultorioId" name="consultorioId" required><option value="">Cargando consultorios...</option></select></div>
        <div class="grid-full"><div class="info-note"><i class="bi bi-info-circle" aria-hidden="true"></i><span>La asignación reemplazará el consultorio actual del horario seleccionado.</span></div></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/consultorios}">Cancelar</a><button class="btn btn-primary" type="submit">Confirmar asignación</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
