<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Asignar consultorio | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="consultorios-asignar">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row"><aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Programación de ambientes</span><h1>Asignar consultorio</h1><p>Relaciona un horario médico con un ambiente disponible.</p></div><a class="btn btn-outline-secondary" th:href="@{/consultorios}">Volver</a></div>
    <div id="mensaje"></div><form id="form-asignacion" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="horarioId">Horario médico</label><select class="form-select" id="horarioId" name="horarioId" required><option value="">Cargando horarios...</option></select></div>
        <div><label class="form-label" for="consultorioId">Consultorio</label><select class="form-select" id="consultorioId" name="consultorioId" required><option value="">Cargando consultorios...</option></select></div>
        <div class="grid-full"><div class="info-note"><i class="bi bi-info-circle"></i><span>La asignación reemplazará el consultorio actual del horario seleccionado.</span></div></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/consultorios}">Cancelar</a><button class="btn btn-primary" type="submit">Confirmar asignación</button></div></form>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
