<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Registrar consultorio')}"></head>
<body data-page="consultorios-registrar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Registrar consultorio</h1><p>Agrega un ambiente al inventario asistencial.</p></div><a class="btn btn-outline-secondary" th:href="@{/consultorios}">Volver</a></div>
    <div id="mensaje" aria-live="polite"></div><form id="form-consultorio" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="codigo">Código</label><input class="form-control" id="codigo" value="Se genera al guardar" readonly><div class="form-text">Identificador interno. El nombre puede indicar el número físico del ambiente.</div></div>
        <div><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" maxlength="100" required></div>
        <div><label class="form-label" for="piso">Piso</label><input class="form-control" type="number" id="piso" name="piso" min="0" required></div>
        <div><label class="form-label" for="area">Área</label><input class="form-control" id="area" name="area" maxlength="100" required></div>
        <div><label class="form-label" for="estado">Estado operativo</label><select class="form-select" id="estado" name="estado"><option value="DISPONIBLE">Operativo</option><option value="INACTIVO">Inactivo</option></select><div class="form-text">La disponibilidad se comprueba para el día, hora y vigencia de cada horario.</div></div>
        <div><label class="form-label" for="especialidadId">Especialidad (opcional)</label><select class="form-select" id="especialidadId" name="especialidadId"><option value="">Sin especialidad</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/consultorios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar consultorio</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
