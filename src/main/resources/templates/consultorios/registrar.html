<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar consultorio | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="consultorios-registrar">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row"><aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Infraestructura clínica</span><h1>Registrar consultorio</h1><p>Agrega un ambiente al inventario asistencial.</p></div><a class="btn btn-outline-secondary" th:href="@{/consultorios}">Volver</a></div>
    <div id="mensaje"></div><form id="form-consultorio" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="codigo">Código</label><input class="form-control" id="codigo" name="codigo" maxlength="20" required></div>
        <div><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" maxlength="100" required></div>
        <div><label class="form-label" for="piso">Piso</label><input class="form-control" type="number" id="piso" name="piso" min="0" required></div>
        <div><label class="form-label" for="area">Área</label><input class="form-control" id="area" name="area" maxlength="100" required></div>
        <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado"><option value="DISPONIBLE">Disponible</option><option value="OCUPADO">Ocupado</option><option value="INACTIVO">Inactivo</option></select></div>
        <div><label class="form-label" for="especialidadId">Especialidad (opcional)</label><select class="form-select" id="especialidadId" name="especialidadId"><option value="">Sin especialidad</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/consultorios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar consultorio</button></div></form>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
