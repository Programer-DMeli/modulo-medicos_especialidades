<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Acceso denegado')}"></head>
<body data-page="acceso-denegado" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<section class="access-denied"><i class="bi bi-shield-lock" aria-hidden="true"></i><h1>Acceso denegado</h1><p class="text-muted">Tu rol no tiene permiso para abrir esta sección. Puedes volver al inicio y continuar con las opciones disponibles.</p><a class="btn btn-primary mt-3" th:href="@{/}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Volver al inicio</a></section>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
