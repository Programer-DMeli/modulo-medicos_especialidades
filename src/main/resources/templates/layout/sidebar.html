<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<aside class="app-sidebar" id="menu-lateral" th:fragment="sidebar">
    <nav aria-label="Navegación principal">
        <p class="nav-group-title">Atención médica</p>
        <div class="list-group">
            <a class="nav-link" th:href="@{/}"><i class="bi bi-grid" aria-hidden="true"></i>Inicio</a>
            <a class="nav-link" th:href="@{/horarios}" sec:authorize="hasAnyRole('ADMINISTRADOR','MEDICO','RECEPCIONISTA')"><i class="bi bi-calendar-week" aria-hidden="true"></i>Horarios y agenda</a>
            <a class="nav-link" th:href="@{/medicos}" sec:authorize="hasAnyRole('ADMINISTRADOR','RECEPCIONISTA')"><i class="bi bi-person-badge" aria-hidden="true"></i>Médicos</a>
            <a class="nav-link" th:href="@{/especialidades}" sec:authorize="isAuthenticated()"><i class="bi bi-heart-pulse" aria-hidden="true"></i>Especialidades</a>
            <a class="nav-link" th:href="@{/consultorios}" sec:authorize="hasAnyRole('ADMINISTRADOR','RECEPCIONISTA')"><i class="bi bi-door-open" aria-hidden="true"></i>Consultorios</a>
        </div>
        <th:block sec:authorize="hasRole('ADMINISTRADOR')">
            <p class="nav-group-title">Administración</p>
            <div class="list-group">
                <a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-people" aria-hidden="true"></i>Usuarios</a>
                <a class="nav-link" th:href="@{/roles}"><i class="bi bi-shield-check" aria-hidden="true"></i>Roles</a>
                <a class="nav-link" th:href="@{/auditoria}"><i class="bi bi-journal-text" aria-hidden="true"></i>Auditoría</a>
            </div>
        </th:block>
    </nav>
    <p class="sidebar-note">Organiza el horario habitual y revisa la atención de cada semana.</p>
</aside>
</body></html>
