<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow" th:fragment="navbar">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-hospital"></i>
            Sistema Médico
        </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>
        <div class="collapse navbar-collapse" id="menuNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}">
                        <i class="bi bi-house-door-fill"></i>
                        Inicio
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','MEDICO')">
                    <a class="nav-link" th:href="@{/medicos}">
                        Médicos
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/especialidades}">
                        Especialidades
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RECEPCIONISTA')">
                    <a class="nav-link" th:href="@{/horarios}">
                        Horarios
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RECEPCIONISTA')">
                    <a class="nav-link" th:href="@{/consultorios}">
                        Consultorios
                    </a>
                </li>

                <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm mt-1">
                            <i class="bi bi-box-arrow-right"></i>
                            Cerrar sesión
                        </button>
                    </form>
                </li>

            </ul>

        </div>

    </div>

</nav>
</body>
</html>
