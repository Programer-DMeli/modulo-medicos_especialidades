<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<header class="navbar app-header" th:fragment="navbar">
    <div class="container-fluid">
        <button class="btn btn-outline-secondary icon-button menu-toggle" type="button" data-toggle-sidebar aria-label="Abrir menú de navegación" aria-controls="menu-lateral" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button>
        <a class="navbar-brand" th:href="@{/}"><span class="brand-mark"><i class="bi bi-hospital" aria-hidden="true"></i></span><span>Sistema Médico<small class="brand-subtitle">Médicos y especialidades</small></span></a>
        <div class="header-user" sec:authorize="isAuthenticated()">
            <span class="user-avatar" aria-hidden="true"><i class="bi bi-person"></i></span>
            <div class="user-details"><strong th:text="${currentUser}">Usuario</strong><small th:text="${currentRole}">Rol</small></div>
            <form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-outline-secondary btn-sm" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Salir</span></button></form>
        </div>
    </div>
</header>
</body></html>
