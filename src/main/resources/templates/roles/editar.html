<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Editar rol')}"></head>
<body data-page="roles-editar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole},data-id=${rolId}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Editar rol</h1><p>Actualiza el rol.</p></div><a class="btn btn-outline-secondary" th:href="@{/roles}">Volver</a></div>
    <div id="mensaje" aria-live="polite"></div>
    <form id="form-rol" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" maxlength="50" required></div>
        <div><label class="form-label" for="descripcion">Descripción</label><input class="form-control" id="descripcion" name="descripcion" maxlength="200"></div>
    <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado"><option value="true">Activo</option><option value="false">Inactivo</option></select><div class="form-text">Un rol inactivo no permite iniciar sesión.</div></div></div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/roles}">Cancelar</a><button class="btn btn-primary" type="submit">Actualizar rol</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
