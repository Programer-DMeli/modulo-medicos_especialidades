<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head(${esMedico} ? 'Mi perfil' : 'Médicos')}"></head>
<body data-page="medicos-listar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading">
            <div><h1 th:text="${esMedico} ? 'Mi perfil' : 'Médicos'">Médicos</h1><p th:text="${esAdministrador} ? 'Consulta y administra el personal médico registrado.' : 'Consulta la información médica disponible para tu cuenta.'">Consulta la información médica disponible para tu cuenta.</p></div>
            <a class="btn btn-primary" th:href="@{/medicos/registrar}" sec:authorize="hasRole('ADMINISTRADOR')"><i class="bi bi-person-plus" aria-hidden="true"></i> Nuevo médico</a>
        </div>
        <div id="mensaje" aria-live="polite"></div>
        <div class="card content-card"><div class="card-body">
            <div class="table-responsive"><table class="table table-hover align-middle mb-0">
                <thead><tr><th scope="col">Código</th><th scope="col">Médico</th><th scope="col">Documento</th><th scope="col">CMP</th><th scope="col">Contacto</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr></thead>
                <tbody id="tabla-medicos"><tr><td colspan="7" class="loading-cell">Cargando médicos...</td></tr></tbody>
            </table></div>
        </div></div>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
