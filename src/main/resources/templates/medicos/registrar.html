<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar médico | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="medicos-registrar">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container-fluid"><div class="row">
    <aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
    <main class="col-lg-10 col-md-9 contenido">
        <div class="page-heading"><div><span class="eyebrow">Directorio clínico</span><h1>Registrar médico</h1><p>Completa la información profesional y de contacto.</p></div><a class="btn btn-outline-secondary" th:href="@{/medicos}">Volver</a></div>
        <div id="mensaje"></div>
        <form id="form-medico" class="card content-card"><div class="card-body form-grid">
            <div><label class="form-label" for="codigoMedico">Código médico</label><input class="form-control" id="codigoMedico" name="codigoMedico" maxlength="20" required></div>
            <div><label class="form-label" for="tipoDocumento">Tipo de documento</label><select class="form-select" id="tipoDocumento" name="tipoDocumento" required><option value="DNI">DNI</option><option value="CE">Carné de extranjería</option><option value="PASAPORTE">Pasaporte</option></select></div>
            <div><label class="form-label" for="numeroDocumento">Número de documento</label><input class="form-control" id="numeroDocumento" name="numeroDocumento" maxlength="15" required></div>
            <div><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" name="nombres" maxlength="100" required></div>
            <div><label class="form-label" for="apellidoPaterno">Apellido paterno</label><input class="form-control" id="apellidoPaterno" name="apellidoPaterno" maxlength="100" required></div>
            <div><label class="form-label" for="apellidoMaterno">Apellido materno</label><input class="form-control" id="apellidoMaterno" name="apellidoMaterno" maxlength="100" required></div>
            <div><label class="form-label" for="cmp">CMP</label><input class="form-control" id="cmp" name="cmp" maxlength="20" required></div>
            <div><label class="form-label" for="rne">RNE</label><input class="form-control" id="rne" name="rne" maxlength="20"></div>
            <div><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" name="telefono" maxlength="15"></div>
            <div><label class="form-label" for="correo">Correo</label><input class="form-control" type="email" id="correo" name="correo" maxlength="150"></div>
            <div><label class="form-label" for="fechaIngreso">Fecha de ingreso</label><input class="form-control" type="date" id="fechaIngreso" name="fechaIngreso" required></div>
            <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado" required><option value="ACTIVO">Activo</option><option value="VACACIONES">Vacaciones</option><option value="SUSPENDIDO">Suspendido</option></select></div>
        </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/medicos}">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar médico</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
