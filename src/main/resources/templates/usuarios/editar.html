<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuario | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="usuarios-editar" th:attr="data-id=${usuarioId}">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row">
<aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Administración</span><h1>Editar usuario</h1><p>Actualiza los datos de la cuenta.</p></div><a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a></div>
    <div id="mensaje"></div>
    <form id="form-usuario" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" maxlength="50" required></div>
        <div><label class="form-label" for="password">Contraseña (dejar vacía para no cambiar)</label><input class="form-control" type="password" id="password" name="password"></div>
        <div><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" name="nombres" maxlength="100" required></div>
        <div><label class="form-label" for="correo">Correo</label><input class="form-control" type="email" id="correo" name="correo" maxlength="150"></div>
        <div><label class="form-label" for="rolId">Rol</label><select class="form-select" id="rolId" name="rolId" required><option value="">Selecciona un rol</option></select></div>
        <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado"><option value="true">Activo</option><option value="false">Inactivo</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Actualizar usuario</button></div></form>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
