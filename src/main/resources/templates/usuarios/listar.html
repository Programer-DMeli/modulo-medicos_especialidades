<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="usuarios-listar">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row">
<aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Administración</span><h1>Usuarios</h1><p>Administra los usuarios del sistema.</p></div><a class="btn btn-primary" th:href="@{/usuarios/registrar}"><i class="bi bi-person-plus"></i> Nuevo usuario</a></div>
    <div id="mensaje"></div>
    <div class="card content-card"><div class="card-body">
        <div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead><tr><th>Usuario</th><th>Nombres</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="tabla-usuarios"><tr><td colspan="6" class="loading-cell">Cargando usuarios...</td></tr></tbody>
        </table></div>
    </div></div>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
