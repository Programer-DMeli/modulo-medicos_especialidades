<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Registrar usuario')}"></head>
<body data-page="usuarios-registrar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Registrar usuario</h1><p>Crea una nueva cuenta de usuario.</p></div><a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a></div>
    <div id="mensaje" aria-live="polite"></div>
    <form id="form-usuario" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" maxlength="50" required></div>
        <div><label class="form-label" for="password">Contraseña</label><input class="form-control" type="password" id="password" name="password" required></div>
        <div><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" name="nombres" maxlength="100" required></div>
        <div><label class="form-label" for="correo">Correo</label><input class="form-control" type="email" id="correo" name="correo" maxlength="150"></div>
        <div><label class="form-label" for="rolId">Rol</label><select class="form-select" id="rolId" name="rolId" required><option value="">Selecciona un rol</option></select></div>
        <div><label class="form-label" for="estado">Estado</label><select class="form-select" id="estado" name="estado"><option value="true">Activo</option><option value="false">Inactivo</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar usuario</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
