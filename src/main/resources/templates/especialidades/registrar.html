<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Registrar especialidad')}"></head>
<body data-page="especialidades-registrar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Registrar especialidad</h1><p>Define una nueva área de atención.</p></div><a class="btn btn-outline-secondary" th:href="@{/especialidades}">Volver</a></div>
    <div id="mensaje" aria-live="polite"></div>
    <form id="form-especialidad" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="codigo">Código</label><input class="form-control" id="codigo" value="Se genera al guardar" readonly><div class="form-text">El sistema asigna un código único automáticamente.</div></div>
        <div><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" maxlength="100" required></div>
        <div class="grid-full"><label class="form-label" for="descripcion">Descripción</label><textarea class="form-control" id="descripcion" name="descripcion" maxlength="200" rows="3"></textarea></div>
        <div><label class="form-label" for="duracionConsulta">Duración de consulta</label><div class="input-group"><input class="form-control" type="number" id="duracionConsulta" name="duracionConsulta" min="1" required><span class="input-group-text">minutos</span></div></div>
        <div><label class="form-label" for="estado">Estado inicial</label><select class="form-select" id="estado" name="estado"><option value="true">Activa</option><option value="false">Inactiva</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/especialidades}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar especialidad</button></div></form>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
