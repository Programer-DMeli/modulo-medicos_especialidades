<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar especialidad | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="especialidades-registrar">
<div th:replace="~{layout/navbar :: navbar}"></div><div class="container-fluid"><div class="row">
<aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
<main class="col-lg-10 col-md-9 contenido">
    <div class="page-heading"><div><span class="eyebrow">Catálogo asistencial</span><h1>Registrar especialidad</h1><p>Define una nueva área de atención.</p></div><a class="btn btn-outline-secondary" th:href="@{/especialidades}">Volver</a></div>
    <div id="mensaje"></div>
    <form id="form-especialidad" class="card content-card"><div class="card-body form-grid">
        <div><label class="form-label" for="codigo">Código</label><input class="form-control" id="codigo" name="codigo" maxlength="20" required></div>
        <div><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" maxlength="100" required></div>
        <div class="grid-full"><label class="form-label" for="descripcion">Descripción</label><textarea class="form-control" id="descripcion" name="descripcion" maxlength="200" rows="3"></textarea></div>
        <div><label class="form-label" for="duracionConsulta">Duración de consulta</label><div class="input-group"><input class="form-control" type="number" id="duracionConsulta" name="duracionConsulta" min="1" required><span class="input-group-text">minutos</span></div></div>
        <div><label class="form-label" for="estado">Estado inicial</label><select class="form-select" id="estado" name="estado"><option value="true">Activa</option><option value="false">Inactiva</option></select></div>
    </div><div class="card-footer form-actions"><a class="btn btn-light" th:href="@{/especialidades}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar especialidad</button></div></form>
    <div th:replace="~{layout/footer :: footer}"></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
