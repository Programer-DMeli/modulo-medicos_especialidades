<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialidades | Sistema Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-page="especialidades-listar">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container-fluid"><div class="row">
    <aside class="col-lg-2 col-md-3 p-0"><div th:replace="~{layout/sidebar :: sidebar}"></div></aside>
    <main class="col-lg-10 col-md-9 contenido">
        <div class="page-heading"><div><span class="eyebrow">Catálogo asistencial</span><h1>Especialidades</h1><p>Áreas médicas y duración estándar de consulta.</p></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/especialidades/estado}">Gestionar estados</a><a class="btn btn-primary" th:href="@{/especialidades/registrar}"><i class="bi bi-plus-lg"></i> Nueva</a></div></div>
        <div id="mensaje"></div>
        <div class="card content-card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead><tr><th>Código</th><th>Especialidad</th><th>Descripción</th><th>Duración</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="tabla-especialidades"><tr><td colspan="6" class="loading-cell">Cargando especialidades...</td></tr></tbody>
        </table></div></div></div>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script>
</body>
</html>
