<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Especialidades')}"></head>
<body data-page="especialidades-listar" th:attr="data-can-manage=${puedeProgramar},data-is-admin=${esAdministrador},data-role=${currentRole}">
<a class="visually-hidden-focusable position-absolute p-3 bg-white" href="#contenido-principal">Saltar al contenido</a>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="app-shell">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main class="app-main" id="contenido-principal" tabindex="-1">
<div class="page-heading"><div><h1>Especialidades</h1><p>Áreas médicas y duración estándar de consulta.</p></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/especialidades/estado}" sec:authorize="hasRole('ADMINISTRADOR')">Gestionar estados</a><a class="btn btn-primary" th:href="@{/especialidades/registrar}" sec:authorize="hasRole('ADMINISTRADOR')"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva</a></div></div>
        <div id="mensaje" aria-live="polite"></div>
        <div class="card content-card"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
            <thead><tr><th scope="col">Código</th><th scope="col">Especialidad</th><th scope="col">Descripción</th><th scope="col">Duración</th><th scope="col">Estado</th><th scope="col" class="text-end">Acciones</th></tr></thead>
            <tbody id="tabla-especialidades"><tr><td colspan="6" class="loading-cell">Cargando especialidades...</td></tr></tbody>
        </table></div></div></div>
        <div th:replace="~{layout/footer :: footer}"></div>
    </main>
</div>
<button class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
